name: Build and upload web page
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean and Install dependencies
        run : |
          rm -rf node_modules dist
          npm ci --legacy-peer-deps

      - name: Build project
        run: npm run build
        
      - name: 📦 Create ZIP Archive
        run: |
          cd dist
          zip -r ../Arntags.zip .

      - name: 📤 Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-archive
          path: Arntags.zip

      - name: Build project
        run: npm run build:pages

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages  # ou gh-pages
          publish_dir: ./dist
          force_orphan: true    # Nouvelle histoire Git
          user_name: 'GitHub Actions'
          user_email: 'action@github.com'
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build web app
        run: |
          npm ci --legacy-peer-deps
          npm run build:native
          npx cap sync android 

      - name: Grant execute permission to Gradle Wrapper
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arntags-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  ios:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
    
    - name: Install & Update Plugins
      run: |
        rm -rf node_modules/
        rm -rf dist/
        npm ci --legacy-peer-deps
        npm run build:native
        brew install librsvg
        bash scripts/generate-ios-icons.sh public/favicon.svg ios/App/App/Assets.xcassets/AppIcon.appiconset
        npx cap copy ios
        npx cap sync ios
    
    - name: Clean Xcode
      run: |
        rm -rf ~/Library/Developer/Xcode/DerivedData/
        cd ios/App
        xcodebuild clean

    - name: Configure NFC entitlement
      run: |
        /usr/libexec/PlistBuddy -c "Add :com.apple.developer.nfc.readersession.formats array" ios/App/App/App.entitlements 2>/dev/null || true

        /usr/libexec/PlistBuddy -c "Add :com.apple.developer.nfc.readersession.formats:0 string NDEF" ios/App/App/App.entitlements 2>/dev/null || true

        /usr/libexec/PlistBuddy -c "Add :NFCReaderUsageDescription string arntags utilise le NFC pour lire et écrire tes tags NDEF." ios/App/App/Info.plist 2>/dev/null || true

    - name: Build Archive (Swift Fix)
      run: |
        cd ios/App
        xcodebuild archive \
        -project App.xcodeproj \
        -scheme App \
        -configuration Release \
        -sdk iphoneos \
        CODE_SIGN_IDENTITY="" \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGNING_ALLOWED=NO \
        ONLY_ACTIVE_ARCH=NO \
        CODE_SIGN_ENTITLEMENTS="App/App.entitlements" \
        ARCHS=arm64 \
        VALID_ARCHS=arm64 \
        -archivePath "$PWD/App.xcarchive"

    - name: Create unsigned IPA
      run: |
        cd ios/App
        rm -rf Payload export
        mkdir Payload
        mkdir export
        cd Payload
        mkdir Payload
        cd ../
        cp -R App.xcarchive/Products/Applications/*.app Payload/Payload
        cd Payload
        mv ./Payload/App.app ./Payload/Arntags.app
        zip -r ../export/Arntags.ipa .
            
    - uses: actions/upload-artifact@v4
      with:
        name: Arntags.ipa
        path: ios/App/export/*.ipa
